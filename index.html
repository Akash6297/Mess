<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1> 

    <!-- Add Entry Form -->
    <form id="entryForm">
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>

      <input type="number" id="amount" placeholder="Amount" required />
      
      <select id="byWhom" required>
        <option value="">By Whom</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="AURUNA">ARUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>

      <input type="date" id="date" required />
      <div class="note-container">
        <input type="text" id="note" placeholder="Note" />
      </div>
      
      <div>
        <button type="submit">Add Entry</button>
      </div>
    </form>

    <!-- Filters -->
    <div class="filters">
      <select id="filterType">
        <option value="all">All</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>
      <select id="filterPerson">
        <option value="all">All</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="AURUNA">AURUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>
    </div>

    <!-- Entry List -->
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Amount</th>
          <th>By</th>
          <th>Date</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="entryList">
        <!-- JS Will Populate -->
      </tbody>
    </table>

    <!-- Charts Section -->
    <div style="display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
      <div style="flex: 1;">
        <label for="overallChartType">Overall Chart Type:</label>
        <select id="overallChartType">
          <option value="bar">Bar</option>
          <option value="pie">Pie</option>
          <option value="doughnut">Doughnut</option>
        </select>
        <canvas id="overallChart" width="250" height="250"></canvas>
      </div>

      <div style="flex: 1;">
        <label for="personChartType">Person Chart Type:</label>
        <select id="personChartType">
          <option value="bar">Bar</option>
          <option value="pie">Pie</option>
          <option value="doughnut">Doughnut</option>
        </select>
        <canvas id="personChart" width="250" height="250"></canvas>
      </div>
    </div>

    <br>
    <button id="downloadExcel">Download Full Report</button>
  </div>

  <!-- Chart.js and Excel Download Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
