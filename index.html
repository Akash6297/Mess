<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    canvas {
      background: #fff;
      border: 1px solid #ccc;
      padding: 10px;
    }

    /* Loading Spinner */
    .loading {
      display: none;
      text-align: center;
    }

    .loading.show {
      display: block;
    }

    /* Styling for Filter Section */
    .filters select {
      margin-right: 10px;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 10px;
      text-align: left;
    }

    /* Button Styling */
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Add Entry Form -->
    <form id="entryForm">
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>

      <input type="number" id="amount" placeholder="Amount" required />
      
      <select id="byWhom" required>
        <option value="">By Whom</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="ARUNA">ARUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>

      <input type="date" id="date" required />
      <div class="note-container">
        <input type="text" id="note" name="note" placeholder="Note" />
      </div>
      
      <div>
        <button type="submit">Add Entry</button>
      </div>
    </form>

    <!-- Filters -->
    <div class="filters">
      <select id="filterType">
        <option value="all">All</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>
      <select id="filterPerson">
        <option value="all">All</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="ARUNA">ARUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading">
      <p>Loading...</p>
    </div>

    <!-- Entry List -->
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Amount</th>
          <th>By</th>
          <th>Date</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="entryList">
        <!-- JS will populate this -->
      </tbody>
    </table>

    <!-- Charts Section -->
    <div style="display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 40px;">
      <!-- Overall Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="overallChartType">Overall Chart Type:</label>
        <select id="overallChartType">
          <option value="bar">Bar</option>
          <option value="pie">Pie</option>
          <option value="doughnut">Doughnut</option>
        </select>
        <canvas id="overallChart" width="300" height="300"></canvas>
      </div>

      <!-- Deposit Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="depositChartType">Deposit Chart:</label>
        <select id="depositChartType">
          <option value="pie">Pie</option>
        </select>
        <canvas id="depositChart" width="300" height="300"></canvas>
      </div>

      <!-- Expense Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="expenseChartType">Expense Chart:</label>
        <select id="expenseChartType">
          <option value="pie">Pie</option>
        </select>
        <canvas id="expenseChart" width="300" height="300"></canvas>
      </div>
    </div>

    <br>
    <button id="downloadExcel">Download Full Report</button>
  </div>

  <!-- Chart.js and XLSX Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>

  <script>
    // Display loading spinner when data is being processed
    document.getElementById('loading').classList.add('show');

    // Hide the loading spinner after data is fetched or processed
    setTimeout(function() {
      document.getElementById('loading').classList.remove('show');
    }, 3000); // Simulate data fetching delay
  </script>
</body>
</html>
