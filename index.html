<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#007bff">

</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>
     <!-- Top Bar Showing Unfulfilled Requirements -->
     <div id="requirementTopBar"></div>
  
     <ul id="fulfilledList"></ul>

    <!-- Add Entry Form -->
    <form id="entryForm">
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>

      <input type="number" id="amount" placeholder="Amount" required />
      
      <select id="byWhom" required>
        <option value="">By Whom</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="ARUNA">ARUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>

      <input type="date" id="date" required />
      <div class="note-container">
        <input type="text" id="note" name="note" placeholder="Note" />
      </div>
      
      <div>
        <button type="submit">Add Entry</button>
      </div>
    </form>

    <!-- Filters -->
    <div class="filters">
      <select id="filterType">
        <option value="all">All</option>
        <option value="expense">Expense</option>
        <option value="deposit">Deposit</option>
      </select>
      <select id="filterPerson">
        <option value="all">All</option>
        <option value="AKASH">AKASH</option>
        <option value="SUBHO">SUBHO</option>
        <option value="ARUNA">ARUNA</option>
        <option value="PAPAI">PAPAI</option>
      </select>
    </div>

    
    <!-- Entry List -->
     <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Amount</th>
          <th>By</th>
          <th>Date</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="entryList">
        <!-- JS will populate this -->
      </tbody>
    </table>
  </div>

    <!-- Charts Section -->
     <br>
     <br>
     <br>
     <div> Select Overall Chart Type:</div>
    <select id="overallChartType">
      <option value="bar">Bar</option>
      <option value="pie">Pie</option>
      <option value="doughnut">Doughnut</option>
    </select>
    <div class="responsive-flex-container">
      <!-- Overall Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="overallChartType">Overall</label>
        
        <canvas id="overallChart" width="300" height="300"></canvas>
      </div>

      <!-- Deposit Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="depositChartType">Deposit</label>
        
        <canvas id="depositChart" width="300" height="300"></canvas>
      </div>

      <!-- Expense Chart -->
      <div style="flex: 1; text-align: center;">
        <label for="expenseChartType">Expense</label>
        
        <canvas id="expenseChart" width="300" height="300"></canvas>
      </div>
    </div>

    <br>
    <button id="downloadExcel">Download Full Report</button>
  </div>
  <div class="container">
     
<!-- Floating Requirement Button and Form -->
<div id="requirementFloating">
  <button id="requirementToggle">+</button>
  <div id="requirementForm">
    <h3>Add Requirement</h3>
    <input type="text" id="requirementInput" placeholder="Enter requirement" />
    <button onclick="addRequirement()">Add</button>
  </div>
</div>

  <!-- Chart.js and XLSX Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('requirementToggle').addEventListener('click', function() {
      const form = document.getElementById('requirementForm');
      form.style.display = form.style.display === 'none' || form.style.display === '' ? 'block' : 'none';
    });
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
  
</body>
</html>
